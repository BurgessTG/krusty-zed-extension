id = "krusty"
name = "Krusty"
description = "Terminal-based AI coding assistant with multi-provider support and 100+ language servers."
version = "0.2.6"
schema_version = 1
authors = ["BurgessTG"]
repository = "https://github.com/BurgessTG/Krusty"

[agent_servers.krusty]
name = "Krusty"
icon = "./icons/krusty.svg"

[agent_servers.krusty.targets.darwin-aarch64]
