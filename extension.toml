args = ["acp"]

[agent_servers.krusty.targets.darwin-x86_64]
archive = "https://github.com/BurgessTG/Krusty/releases/download/v0.2.8/krusty-x86_64-apple-darwin.tar.gz"
cmd = "./krusty"
args = ["acp"]

[agent_servers.krusty.targets.linux-aarch64]
archive = "https://github.com/BurgessTG/Krusty/releases/download/v0.2.8/krusty-aarch64-unknown-linux-gnu.tar.gz"
cmd = "./krusty"
args = ["acp"]

[agent_servers.krusty.targets.linux-x86_64]
archive = "https://github.com/BurgessTG/Krusty/releases/download/v0.2.8/krusty-x86_64-unknown-linux-gnu.tar.gz"
cmd = "./krusty"
args = ["acp"]

[agent_servers.krusty.targets.windows-x86_64]
